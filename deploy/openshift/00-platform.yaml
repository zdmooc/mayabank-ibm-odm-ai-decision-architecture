apiVersion: v1
kind: Namespace
metadata:
  name: mayainsurance-decision-local
  labels:
    app.kubernetes.io/part-of: mayainsurance-decision
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decision-api
  namespace: mayainsurance-decision-local
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: decision-lab-quota
  namespace: mayainsurance-decision-local
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: decision-lab-limits
  namespace: mayainsurance-decision-local
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: decision-api-config
  namespace: mayainsurance-decision-local
data:
  HOST: 0.0.0.0
  PORT: "8080"
  DECISION_MODE: portable
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: decision-api
  namespace: mayainsurance-decision-local
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: decision-api
  namespace: mayainsurance-decision-local
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: decision-api:latest
  triggers: []
